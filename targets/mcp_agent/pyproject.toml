[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anonframework-target-mcp-agent"
version = "0.1.0"
description = "MCP (Model Context Protocol) tool-using LLM agent as a anonframework target: red-team the tool supply chain (tool-poisoning / poisoned tool descriptions). Uniquely end-to-end verifiable in CI via an in-memory MCP server."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Anonymous Authors" }]
dependencies = ["anonframework>=0.1.0", "mcp>=2.2,<3", "litellm>=1.0", "anyio>=4.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=6.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_agent_target"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--strict-markers"
testpaths = ["tests"]
markers = ["integration: end-to-end test against a real LiteLLM proxy + MCP server"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["mcp.*", "litellm.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py313"
[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["UP046", "UP047"]
