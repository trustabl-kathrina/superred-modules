[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anonframework-target-hackaprompt"
version = "0.1.0"
description = "HackAPrompt target: runs one of the 11 HackAPrompt prompt-hijacking levels (defended LLM applications) against the model under test via litellm, with the level defenses (templates + input filters) ported byte-for-byte. Pairs with the hackaprompt claim."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "LICENSES/*"]
requires-python = ">=3.11,<3.14"
authors = [{ name = "Anonymous Authors" }]
dependencies = ["anonframework>=0.1.0", "litellm>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=6.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/hackaprompt_target"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
# The verbatim-vendored level defenses (long upstream templates, trailing
# whitespace preserved) live under _vendor and are not linted.
extend-exclude = ["src/hackaprompt_target/_vendor"]
[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
strict = true
python_version = "3.13"
