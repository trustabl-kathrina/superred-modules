[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anonframework-target-langchain-agent"
version = "0.1.0"
description = "LangChain (v1) create_agent agent as a anonframework target: red-team a real LangChain agent graph (tool-calling loop) for prompt injection / agent misuse. Offline-testable via a scripted chat model."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Anonymous Authors" }]
dependencies = ["anonframework>=0.1.0", "langchain>=1.3,<2", "langchain-core>=1.5,<2", "langgraph>=1.2.5,<2"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=6.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/langchain_agent_target"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--strict-markers"
testpaths = ["tests"]
markers = ["integration: end-to-end test against a real model"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]
[[tool.mypy.overrides]]
module = ["langchain.*", "langchain_core.*", "langgraph.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py313"
[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["UP046", "UP047"]
