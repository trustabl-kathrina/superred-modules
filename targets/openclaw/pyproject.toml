[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anonframework-target-openclaw"
version = "0.1.0"
description = "OpenClaw agent target module for anonframework"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Anonymous Authors" }]
keywords = [
    "anonframework",
    "red-teaming",
    "ai-safety",
    "security",
    "llm",
    "target",
    "agent",
]
dependencies = ["anonframework>=0.1.0", "websockets", "cryptography"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]

[project.optional-dependencies]
injection = ["aiohttp"]
proxy = ["aiohttp"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "aiohttp",
    "anonframework-optimizer-demo-prompt-list",
]

[tool.hatch.build.targets.wheel]
packages = ["src/openclaw_target"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["."]
markers = [
    "provider: opt-in tests against a real LLM provider (requires GEMINI_API_KEY)",
    "controller_e2e: full Controller + real gateway + real provider E2E (requires GEMINI_API_KEY)",
    "docker: real-container tests (requires Docker daemon) - the production isolation path",
    "local_gateway: real local `openclaw gateway` CLI tests - fast dev path, no Docker",
]
