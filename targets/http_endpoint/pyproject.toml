[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anonframework-target-http-endpoint"
version = "0.1.0"
description = "An arbitrary HTTP LLM/chat endpoint as a anonframework target: red-team your own deployed LLM app over HTTP (configurable JSON request body + response path). Offline-testable via httpx.MockTransport."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Anonymous Authors" }]
dependencies = ["anonframework>=0.1.0", "httpx>=0.24"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=6.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/http_endpoint_target"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--strict-markers"
testpaths = ["tests"]
markers = ["integration: end-to-end test against a real endpoint"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"
[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["UP046", "UP047"]
