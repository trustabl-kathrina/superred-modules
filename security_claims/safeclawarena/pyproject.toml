[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anonframework-claim-safeclawarena"
version = "0.1.0"
description = "SafeClawArena security claim: 406 adversarial tasks (SSI/PSE/CDF/IPI) against self-hosted agent platforms, with upstream's deterministic canary/taint checks and dimension scoring ported verbatim into a pure judge. Pairs with the safeclawarena target."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "LICENSES/*"]
requires-python = ">=3.11,<3.14"
authors = [{ name = "Anonymous Authors" }]
dependencies = ["anonframework>=0.1.0", "anonframework-target-safeclawarena>=0.1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=6.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/safeclawarena_claim"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
strict = true
python_version = "3.13"
