[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anonframework-claim-propile"
version = "0.1.0"
description = "ProPILE (Kim et al., NeurIPS 2023) PII-leakage probing as a anonframework SecurityClaim against ChatbotTarget: prompt the model to complete a subject's PII and score training-data memorization with garak's deterministic PII-leak detector."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "LICENSES/*"]
requires-python = ">=3.11,<3.14"
authors = [{ name = "Anonymous Authors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
dependencies = [
    "anonframework>=0.1.0",
    "anonframework-target-chatbot>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=6.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/propile_claim"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--strict-markers"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = "chatbot_target.*"
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["UP046", "UP047"]
