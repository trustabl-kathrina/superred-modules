[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anonframework-claim-hackaprompt"
version = "0.1.0"
description = "HackAPrompt security claim: 11 prompt-hijacking levels (defended LLM applications) with upstream's deterministic exact-match win condition ported into a pure judge. Optimizer-driven; pairs with the hackaprompt target."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "LICENSES/*"]
requires-python = ">=3.11,<3.14"
authors = [{ name = "Anonymous Authors" }]
dependencies = ["anonframework>=0.1.0", "anonframework-target-hackaprompt>=0.1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=6.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/hackaprompt_claim"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
strict = true
python_version = "3.13"
