[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "security-claim-chatbot-suite"
version = "0.1.0"
description = "Combined chatbot safety SecurityClaim (HarmBench + SORRY-Bench + StrongREJECT, deduplicated) for anonframework"
requires-python = ">=3.11,<3.14"
dependencies = [
    "anonframework>=0.1.0",
    "anonframework-claim-harmbench>=0.1.0",
    "anonframework-claim-sorry-bench>=0.1.0",
    "anonframework-claim-strongreject>=0.1.0",
]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio"]

[tool.hatch.build.targets.wheel]
packages = ["src/security_claim_chatbot_suite"]
