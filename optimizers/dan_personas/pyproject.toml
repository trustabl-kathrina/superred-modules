[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anonframework-optimizer-dan-personas"
version = "0.1.0"
description = "DAN persona jailbreak optimizer for anonframework, ported from NVIDIA garak"
requires-python = ">=3.11,<3.14"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "LICENSES/*"]
authors = [{ name = "Anonymous Authors" }]
keywords = [
    "red-teaming",
    "ai-safety",
    "jailbreak",
    "dan",
    "persona",
    "garak",
    "llm-security",
    "anonframework",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
dependencies = ["anonframework>=0.1.0"]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/dan_personas_optimizer"]
