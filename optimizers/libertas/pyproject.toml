[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anonframework-optimizer-libertas"
version = "0.1.0"
description = "Byte-faithful, model-aware replay of Pliny's L1B3RT4S jailbreak prompt corpus"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Anonymous Authors" }]
keywords = [
    "anonframework",
    "red-teaming",
    "ai-safety",
    "security",
    "llm",
    "optimizer",
    "jailbreak",
    "prompt-injection",
    "libertas",
]
dependencies = ["anonframework>=0.1.0"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio", "mypy", "ruff", "build", "twine"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
pythonpath = ["src"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.hatch.build.targets.wheel]
packages = ["src/libertas_optimizer"]

[tool.hatch.build.targets.sdist]
include = [
    "ASSUMPTIONS.md",
    "LICENSE",
    "NOTICE",
    "README.md",
    "pyproject.toml",
    "scripts",
    "src",
    "tests",
]
