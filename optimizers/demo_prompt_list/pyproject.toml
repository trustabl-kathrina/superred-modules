[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anonframework-optimizer-demo-prompt-list"
version = "0.1.0"
description = "Demo optimizer for anonframework: replays a fixed prompt list, ignores the goal, and does not learn. Not a real attack."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Anonymous Authors" }]
keywords = [
    "anonframework",
    "red-teaming",
    "ai-safety",
    "security",
    "llm",
    "optimizer",
    "demo",
]
dependencies = [
    "anonframework>=0.1.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]

[tool.hatch.build.targets.wheel]
packages = ["src/demo_prompt_list_optimizer"]
