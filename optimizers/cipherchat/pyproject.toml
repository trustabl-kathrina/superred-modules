[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anonframework-optimizer-cipherchat"
version = "0.1.0"
description = "CipherChat cipher-based jailbreak optimizer for anonframework, ported from RobustNLP/CipherChat"
requires-python = ">=3.11,<3.14"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "LICENSES/*"]
authors = [{ name = "Anonymous Authors" }]
keywords = [
    "red-teaming",
    "ai-safety",
    "jailbreak",
    "cipherchat",
    "cipher",
    "llm-security",
    "anonframework",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
dependencies = ["anonframework>=0.1.0"]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio"]

[tool.ruff]
# _vendor/ holds CipherChat code pinned byte-identically; never lint it.
extend-exclude = ["src/cipherchat_optimizer/_vendor"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/cipherchat_optimizer"]
