[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anonframework-optimizer-autodan-turbo"
version = "0.1.0"
description = "AutoDAN-Turbo lifelong-strategy jailbreak optimizer for anonframework"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Anonymous Authors" }]
keywords = [
    "anonframework",
    "red-teaming",
    "ai-safety",
    "security",
    "llm",
    "optimizer",
    "jailbreak",
]
dependencies = [
    "anonframework>=0.1.0",
    # Failure classification (retry a transient provider error, raise a
    # permanent one) needs litellm's exception classes. anonframework already
    # pulls litellm in; this states the direct use.
    "litellm>=1.89.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/autodan_turbo_optimizer"]
