[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anonframework-optimizer-tap"
version = "0.1.0"
description = "Tree of Attacks with Pruning (TAP) optimizer for anonframework"
requires-python = ">=3.11,<3.14"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Anonymous Authors" }]
dependencies = [
    "anonframework>=0.1.0",
    # Failure classification (retry a transient provider error, raise a
    # permanent one) needs litellm's exception classes. anonframework already
    # pulls litellm in; this states the direct use.
    "litellm>=1.89.0",
]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio"]

[tool.hatch.build.targets.wheel]
packages = ["src/tap_optimizer"]
