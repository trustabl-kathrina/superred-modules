[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anonframework-optimizer-skeleton-key"
version = "0.1.0"
description = "Skeleton Key single-turn jailbreak optimizer for anonframework, ported from Microsoft PyRIT"
requires-python = ">=3.11,<3.14"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "LICENSES/*"]
authors = [{ name = "Anonymous Authors" }]
keywords = [
    "red-teaming",
    "ai-safety",
    "jailbreak",
    "skeleton-key",
    "single-turn",
    "pyrit",
    "llm-security",
    "anonframework",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
dependencies = ["anonframework>=0.1.0", "pyyaml>=6.0"]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio"]

[tool.ruff]
line-length = 100
target-version = "py311"
# _vendor/ holds PyRIT seed prompts pinned byte-identically; never lint it.
extend-exclude = ["src/skeleton_key_optimizer/_vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
# UP046/UP047 (PEP 695 generics) are ignored so shared patterns stay
# byte-identical across modules and support Python 3.11.
ignore = ["UP046", "UP047"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
# packages=[...] already ships the whole tree, INCLUDING the non-.py _vendor
# .prompt seed files. Do NOT add force-include for a path already under
# packages (it double-maps and makes the wheel unbuildable).
packages = ["src/skeleton_key_optimizer"]
