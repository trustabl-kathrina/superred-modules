[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anonframework-optimizer-pair"
version = "0.1.0"
description = "PAIR jailbreak optimizer for anonframework"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "LICENSES/*"]
authors = [{ name = "Anonymous Authors" }]
keywords = [
    "anonframework",
    "red-teaming",
    "ai-safety",
    "security",
    "llm",
    "optimizer",
    "jailbreak",
]
dependencies = ["anonframework>=0.1.0"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio", "mypy", "ruff"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
pythonpath = ["src"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.ruff]
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["src/pair_optimizer"]
