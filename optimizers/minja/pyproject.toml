[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anonframework-optimizer-minja"
version = "0.1.0"
description = "MINJA memory-injection optimizer for anonframework agent targets"
requires-python = ">=3.11,<3.14"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "LICENSES/*"]
authors = [{ name = "Anonymous Authors" }]
dependencies = ["anonframework>=0.1.0"]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio", "mypy", "ruff"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
pythonpath = ["src"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.ruff]
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["src/minja_optimizer"]
